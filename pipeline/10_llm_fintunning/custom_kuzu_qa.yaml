global_params:
  working_dir: cache
  graph_backend: kuzu
  kv_backend: rocksdb

nodes:
  - id: read_graph
    op_name: read_graph
    type: source
    dependencies: []
    save_output: true
    params:
      working_dir: cache
      graph_backend: kuzu
      kv_backend: rocksdb
      namespace: graph
      include_nodes: true
      include_edges: true
      skip_judged: false

  - id: quiz
    op_name: quiz
    type: map_batch
    dependencies:
      - read_graph
    execution_params:
      replicas: 1
      batch_size: 128
    params:
      quiz_samples: 2

  - id: judge
    op_name: judge
    type: map_batch
    dependencies:
      - quiz
    execution_params:
      replicas: 1
      batch_size: 128

  - id: partition
    op_name: partition
    type: aggregate
    dependencies:
      - judge
    save_output: false
    params:
      method: ece
      method_params:
        max_units_per_community: 20
        min_units_per_community: 5
        max_tokens_per_community: 10240
        unit_sampling: max_loss


  - id: generate_atomic
    op_name: generate
    type: map_batch
    dependencies:
      - partition
    execution_params:
      replicas: 4
      batch_size: 128
    save_output: true
    params:
      method: atomic
      data_format: ChatML

  - id: generate_aggregated
    op_name: generate
    type: map_batch
    dependencies:
      - partition
    execution_params:
      replicas: 4
      batch_size: 128
    save_output: true
    params:
      method: aggregated
      data_format: ChatML

  - id: generate_multi_hop
    op_name: generate
    type: map_batch
    dependencies:
      - partition
    execution_params:
      replicas: 4
      batch_size: 128
    save_output: true
    params:
      method: multi_hop
      data_format: ChatML

  - id: generate_true_false
    op_name: generate
    type: map_batch
    dependencies:
      - partition
    execution_params:
      replicas: 4
      batch_size: 128
    save_output: true
    params:
      method: true_false
      num_of_questions: 2
      data_format: ChatML