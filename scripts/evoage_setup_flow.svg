<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>EvoAge Setup Flow</title>
  <desc>Six-step setup flow with clear serpentine direction: steps 1 to 3 move left to right, step 3 moves down to step 4, and steps 4 to 6 move right to left.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbfd"/>
      <stop offset="100%" stop-color="#eef4f7"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#173843" flood-opacity="0.12"/>
    </filter>

    <style>
      .page-title { font: 700 42px Arial, sans-serif; fill: #102b35; }
      .subtitle { font: 400 18px Arial, sans-serif; fill: #526b75; }
      .direction-label { font: 700 13px Arial, sans-serif; fill: #56717a; letter-spacing: 1.5px; }

      .card { fill: #ffffff; stroke: #c8d7dd; stroke-width: 2; }
      .card-env { fill: #fff9ed; stroke: #e6a12a; stroke-width: 2.5; }
      .card-start { fill: #f3fbf6; stroke: #72a98a; stroke-width: 2.5; }

      .step-circle { fill: #2f6070; }
      .step-circle-env { fill: #d58a17; }
      .step-circle-start { fill: #3f7e5d; }
      .step-number { font: 700 18px Arial, sans-serif; fill: #ffffff; text-anchor: middle; dominant-baseline: middle; }

      .card-title { font: 700 20px Arial, sans-serif; fill: #122e38; }
      .command-box { fill: #f1f6f8; }
      .command { font: 700 15px "DejaVu Sans Mono", monospace; fill: #183944; }
      .body { font: 400 14px Arial, sans-serif; fill: #526b75; }
      .body-strong { font: 700 14px Arial, sans-serif; fill: #36535d; }

      .connector { fill: none; stroke: #2f6070; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .arrow-head { fill: #2f6070; }
      .flow-pill { fill: #e8f1f4; stroke: #cadbe1; stroke-width: 1.5; }
      .flow-pill-text { font: 700 12px Arial, sans-serif; fill: #45636d; letter-spacing: 1px; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect x="24" y="24" width="1552" height="852" rx="26" fill="none" stroke="#dfe9ed" stroke-width="2"/>

  <text x="76" y="82" class="page-title">EvoAge Setup Flow</text>
  <text x="76" y="116" class="subtitle">Run commands from the repository root. Complete the environment files before service provisioning.</text>



  <!-- ================= CONNECTORS ================= -->

  <!-- Step 1 -> Step 2 -->
  <line x1="484" y1="299" x2="540" y2="299" class="connector"/>
  <polygon points="540,299 520,286 520,312" class="arrow-head"/>

  <!-- Step 2 -> Step 3 -->
  <line x1="980" y1="299" x2="1036" y2="299" class="connector"/>
  <polygon points="1036,299 1016,286 1016,312" class="arrow-head"/>

  <!-- Step 3 -> Step 4 -->
  <path d="M1260 414 L1260 488" class="connector"/>
  <polygon points="1260,488 1247,468 1273,468" class="arrow-head"/>



  <!-- Step 4 -> Step 5 -->
  <line x1="1036" y1="653" x2="980" y2="653" class="connector"/>
  <polygon points="980,653 1000,640 1000,666" class="arrow-head"/>

  <!-- Step 5 -> Step 6 -->
  <line x1="540" y1="653" x2="484" y2="653" class="connector"/>
  <polygon points="484,653 504,640 504,666" class="arrow-head"/>

  <!-- ================= CARD 1 ================= -->
  <g filter="url(#shadow)">
    <rect x="76" y="184" width="408" height="230" rx="20" class="card"/>
  </g>
  <circle cx="116" cy="226" r="24" class="step-circle"/>
  <text x="116" y="226" class="step-number">1</text>
  <text x="154" y="233" class="card-title">Install app dependencies</text>

  <rect x="102" y="258" width="356" height="46" rx="10" class="command-box"/>
  <text x="118" y="287" class="command">bash scripts/setup.sh --all</text>

  <text x="102" y="337" class="body">Installs project dependencies and creates</text>
  <text x="102" y="359" class="body">the initial backend and frontend .env files.</text>

  <!-- ================= CARD 2 ================= -->
  <g filter="url(#shadow)">
    <rect x="572" y="184" width="408" height="230" rx="20" class="card"/>
  </g>
  <circle cx="612" cy="226" r="24" class="step-circle"/>
  <text x="612" y="226" class="step-number">2</text>
  <text x="650" y="233" class="card-title">Download graph dump + artifacts</text>

  <rect x="598" y="258" width="356" height="68" rx="10" class="command-box"/>
  <text x="614" y="283" class="command">bash scripts/</text>
  <text x="614" y="307" class="command">download_evoage_artifacts.sh</text>

  <text x="598" y="359" class="body">Creates:</text>
  <text x="655" y="359" class="body-strong">data/neo4j/neo4j.dump</text>

  <!-- ================= CARD 3 ================= -->
  <g filter="url(#shadow)">
    <rect x="1068" y="184" width="408" height="230" rx="20" class="card-env"/>
  </g>
  <circle cx="1108" cy="226" r="24" class="step-circle-env"/>
  <text x="1108" y="226" class="step-number">3</text>
  <text x="1146" y="233" class="card-title">Fill all environment values</text>

  <rect x="1094" y="258" width="356" height="92" rx="10" class="command-box"/>
  <text x="1110" y="283" class="command">Backend/.env</text>
  <text x="1110" y="307" class="command">Frontend/.env</text>
  <text x="1110" y="331" class="command">Services, paths, JWT, API keys</text>

  <text x="1094" y="381" class="body">Complete these values before provisioning.</text>

  <!-- ================= CARD 4 ================= -->
  <g filter="url(#shadow)">
    <rect x="1068" y="538" width="408" height="230" rx="20" class="card"/>
  </g>
  <circle cx="1108" cy="580" r="24" class="step-circle"/>
  <text x="1108" y="580" class="step-number">4</text>
  <text x="1146" y="587" class="card-title">Set up services</text>

  <rect x="1094" y="612" width="356" height="68" rx="10" class="command-box"/>
  <text x="1110" y="637" class="command">bash scripts/</text>
  <text x="1110" y="661" class="command">setup_services.sh</text>

  <text x="1094" y="713" class="body">Configures Redis, Neo4j and APOC, restores</text>
  <text x="1094" y="735" class="body">the graph dump, and validates database access.</text>

  <!-- ================= CARD 5 ================= -->
  <g filter="url(#shadow)">
    <rect x="572" y="538" width="408" height="230" rx="20" class="card"/>
  </g>
  <circle cx="612" cy="580" r="24" class="step-circle"/>
  <text x="612" y="580" class="step-number">5</text>
  <text x="650" y="587" class="card-title">Verify setup</text>

  <rect x="598" y="612" width="356" height="68" rx="10" class="command-box"/>
  <text x="614" y="637" class="command">bash scripts/setup.sh</text>
  <text x="614" y="661" class="command">--check-only</text>

  <text x="598" y="713" class="body">Checks dependencies, configuration, services,</text>
  <text x="598" y="735" class="body">Neo4j readiness, login, and graph node count.</text>

  <!-- ================= CARD 6 ================= -->
  <g filter="url(#shadow)">
    <rect x="76" y="538" width="408" height="230" rx="20" class="card-start"/>
  </g>
  <circle cx="116" cy="580" r="24" class="step-circle-start"/>
  <text x="116" y="580" class="step-number">6</text>
  <text x="154" y="587" class="card-title">Start EvoAge</text>

  <rect x="102" y="612" width="356" height="46" rx="10" class="command-box"/>
  <text x="118" y="641" class="command">bash scripts/start_app.sh</text>

  <text x="102" y="699" class="body">Backend:</text>
  <text x="171" y="699" class="body-strong">1026</text>
  <text x="249" y="699" class="body">Frontend:</text>
  <text x="322" y="699" class="body-strong">8501</text>
  <text x="102" y="733" class="body-strong">EvoAge is ready.</text>
</svg>
